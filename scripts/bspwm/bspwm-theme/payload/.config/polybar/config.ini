; Catppuccin Mocha, floating bars, touch first. Glyphs: Symbols Nerd Font Mono.

[colors]
base    = #1e1e2e
bg      = #f01e1e2e
s0      = #313244
s1      = #45475a
text    = #cdd6f4
dim     = #6c7086
sub     = #a6adc8
lav     = #b4befe
accent  = ${env:UI_ACCENT:#b4befe}
blue    = #89b4fa
sky     = #89dceb
teal    = #94e2d5
green   = #a6e3a1
yellow  = #f9e2af
peach   = #fab387
red     = #f38ba8
mauve   = #cba6f7

[settings]
screenchange-reload = false
pseudo-transparency = ${env:UI_PSEUDO_TRANS:false}

[bar/base]
monitor         =
width           = ${env:UI_BAR_WIDTH:100%:-40px}
offset-x        = ${env:UI_BAR_OFFSET_X:20}
offset-y        = ${env:UI_BAR_OFFSET_Y:20}
height          = 46pt
radius          = ${env:UI_BAR_RADIUS:18}
dpi             = ${env:POLYBAR_DPI:192}
background      = ${colors.bg}
foreground      = ${colors.text}
padding-left    = 12pt
padding-right   = 12pt
module-margin   = 1
line-size       = 0
border-size     = 0
font-0          = Inter:weight=semibold:size=10;3
font-1          = Symbols Nerd Font Mono:size=13;4
font-2          = Noto Sans:size=10;3
cursor-click    = pointer
cursor-scroll   = ns-resize
wm-restack      = bspwm
enable-ipc      = true
override-redirect = false

; ============================================================ TOP
[bar/top]
inherit         = bar/base
bottom          = false
modules-left    = logo workspaces
modules-center  = date
modules-right   = ${env:UI_TOP_RIGHT:volume battery scale power}

; ============================================================ DOCK
[bar/dock]
inherit         = bar/base
bottom          = true
height          = 50pt
module-margin   = 0
padding-left    = 12pt
padding-right   = 12pt
modules-left    = ${env:UI_DOCK_LEFT:apps terminal files windows}
modules-center  = ${env:UI_DOCK_CENTER:sep swap-prev swap-next shrink grow sep rotate balance layout sep float fullscreen send sep}
modules-right   = ${env:UI_DOCK_RIGHT:close}

; ------------------------------------------------------------ top modules
[module/logo]
; polybar expands ${env:...} in bar values and format-foreground, but NOT in a module
; label - it prints the reference verbatim. custom/script gets the glyph in via the shell.
type = custom/script
exec = echo "$UI_LOGO"
format = <label>
label = %{T2}%output%%{T-}
format-foreground = ${env:UI_LOGO_FG:#cdd6f4}
format-padding = 2
click-left = rofi -show drun

[module/workspaces]
type = internal/bspwm
pin-workspaces = true
enable-click   = true
enable-scroll  = true
format         = <label-state>
label-focused            = %{T2}%{T-}
label-focused-foreground = ${colors.accent}
label-focused-padding    = 2
label-occupied           = %{T2}%{T-}
label-occupied-foreground = ${colors.sub}
label-occupied-padding   = 2
label-urgent             = %{T2}%{T-}
label-urgent-foreground  = ${colors.red}
label-urgent-padding     = 2
label-empty              = %{T2}%{T-}
label-empty-foreground   = ${colors.dim}
label-empty-padding      = 2

[module/date]
type = internal/date
interval = 10
date = %a %d %b
time = %H:%M
label = %{T2}%{T-}  %date%   %time%
format = %{A1:~/.config/bspwm/calendar.sh &:}<label>%{A}
format-padding = 2

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = %{A1:pavucontrol &:}<ramp-volume> <label-volume>%{A}
format-volume-padding = 1
label-volume = %percentage%%
ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}
ramp-volume-foreground = ${colors.teal}
format-muted = %{A1:pavucontrol &:}<label-muted>%{A}
format-muted-padding = 1
label-muted = %{T2}%{T-} off
label-muted-foreground = ${colors.dim}
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/battery]
type = custom/script
exec = ~/.config/bspwm/battery.sh
interval = 15
format = <label>
format-padding = 1

[module/scale]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-foreground = ${colors.sub}
format-padding = 2
click-left = ~/.config/bspwm/settings.sh

[module/power]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-foreground = ${colors.red}
format-padding = 2
click-left = ~/.config/bspwm/power.sh

; ------------------------------------------------------------ dock modules
[module/layout]
type = custom/script
exec = ~/.config/bspwm/layout.sh
interval = 1
format = <label>
label = %{T2}%output%%{T-}
format-padding = 2
click-left = bspc desktop -l next

[module/apps]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = rofi -show drun
format-foreground = ${colors.lav}

[module/terminal]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = xfce4-terminal
format-foreground = ${colors.green}

[module/files]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = thunar
format-foreground = ${colors.yellow}

[module/windows]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = rofi -show window
format-foreground = ${colors.sky}

[module/swap-prev]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node -s prev.local.window
format-foreground = ${colors.blue}

[module/swap-next]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node -s next.local.window
format-foreground = ${colors.blue}

[module/shrink]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = ~/.config/bspwm/resize.sh shrink

[module/grow]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = ~/.config/bspwm/resize.sh grow

[module/rotate]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node @/ -R 90

[module/balance]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node @/ -B

[module/float]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node -t ~floating
format-foreground = ${colors.mauve}

[module/fullscreen]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node -t ~fullscreen
format-foreground = ${colors.mauve}

[module/send]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node -d next --follow
format-foreground = ${colors.peach}

[module/close]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
click-left = bspc node -c
format-foreground = ${colors.red}

[module/winmenu]
type = custom/text
format = <label>
label = %{T2}%{T-}
format-padding = 2
format-foreground = ${colors.accent}
click-left = ~/.config/bspwm/winmenu.sh

[module/sep]
type = custom/text
format = <label>
label = " "
format-padding = 2

